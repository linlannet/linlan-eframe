server:
    port: 8081
    servlet:
        context-path: /eframe_backend/
    tomcat:
        uri-encoding: UTF-8
        accept-count: 1000
        threads:
            max: 800
            min-spare: 100

logging:
    level:
        net.linlan: debug
        org.springframework: warn

spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            first:
                url: jdbc:mysql://mysql:3306/eframedb_1.0?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&&autoReconnect=true&failOverReadOnly=false&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
                username: 'admin'
                password: 'Eframe@2025!'
            second:
                enabled: false
            initialSize: 5
            minIdle: 10
            maxActive: 20
            maxWait: 60000
            connectTimeout: 30000
            socketTimeout: 60000
            timeBetweenEvictionRunsMillis: 60000
            minEvictableIdleTimeMillis: 300000
            maxEvictableIdleTimeMillis: 900000
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                allow:
                url-pattern: /druid/*
                login-username: admin
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
    data:
        redis:
            host: redis
            port: 6379
            database: 0
            password:
            timeout: 10s
            lettuce:
                pool:
                    min-idle: 5
                    max-idle: 10
                    max-active: 1000
                    max-wait: 0ms

platform:
    file:
        dir: /opt/eframe/data/
    prop:
        allowedOrigins: "*"
    database:
        db_encrypt: false
        db_key: encrypt_string
        db_key_out: encrypt_string_out
    backend:
        encrypt: false
        rsa:
            public_key:
            private_key: